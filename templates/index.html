<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>My Todo App</h1>
        
        <form method="POST" action="{{ url_for('add_todo') }}" class="add-form">
            <input type="text" name="title" placeholder="Todo title" required>
            <textarea name="description" placeholder="Description (optional)"></textarea>
            <button type="submit">Add Todo</button>
        </form>
        
        <div class="todos">
            {% for todo in todos %}
            <div class="todo-item {% if todo[3] %}completed{% endif %}">
                <div class="todo-content">
                    <h3>{{ todo[1] }}</h3>
                    {% if todo[2] %}
                    <p>{{ todo[2] }}</p>
                    {% endif %}
                    <small>Created: {{ todo[4] }}</small>
                </div>
                <div class="todo-actions">
                    {% if not todo[3] %}
                    <a href="{{ url_for('complete_todo', todo_id=todo[0]) }}" class="complete-btn">✓</a>
                    {% endif %}
                    <a href="{{ url_for('delete_todo', todo_id=todo[0]) }}" class="delete-btn" onclick="return confirm('Bạn có chắc chắn muốn xóa todo này?')">✗</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
